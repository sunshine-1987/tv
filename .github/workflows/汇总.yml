name: 汇总直播源
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # UTC 03:30 = 北京时间 11:30

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装Python依赖
        run: |
          python3 -m pip install requests

      - name: 执行汇总脚本
        run: python3 merge.py

      - name: 提交更新文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zb3.txt 失效源.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update source"
          git push
